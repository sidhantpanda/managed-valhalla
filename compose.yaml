# Self-hosted Valhalla routing for run-buddy and walking-route-generator.
# valhalla-admin (http://localhost:8003) downloads OpenStreetMap regions and builds routing tiles into ./data/valhalla;
# valhalla serves them and restarts onto each new build.
name: geo-engine
services:
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:latest
    container_name: geo-engine-valhalla
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/geo-engine/start.sh"]
    environment:
      # Threads serving requests.
      server_threads: ${VALHALLA_THREADS:-4}
      # Tile cache per worker thread, in bytes. Tiles are memory-mapped from the tar, so this can stay small.
      VALHALLA_MAX_CACHE_BYTES: ${VALHALLA_MAX_CACHE_BYTES:-134217728}
    volumes:
      - ./data/valhalla:/custom_files
      - ./valhalla/start.sh:/geo-engine/start.sh:ro
    ports:
      - "${VALHALLA_PORT:-8002}:8002"
    # The homelab has 4 GB in total; leave room for the OS, the admin and the two apps.
    mem_limit: ${VALHALLA_MEM_LIMIT:-3g}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8002/status"]
      interval: 30s
      timeout: 5s
      # Until the first region is built there is nothing to serve.
      start_period: 2h
      retries: 3

  valhalla-admin:
    build: ./valhalla-admin
    image: geo-engine-valhalla-admin
    container_name: geo-engine-valhalla-admin
    restart: unless-stopped
    environment:
      DATA_DIR: /custom_files
      VALHALLA_URL: http://valhalla:8002
      # Installed automatically when the data volume has no regions yet.
      DEFAULT_REGIONS: ${VALHALLA_DEFAULT_REGIONS:-us/new-york}
      BUILD_THREADS: ${VALHALLA_BUILD_THREADS:-4}
      # Adds hill grades so routes can avoid steep climbs; downloads elevation data for the built area.
      BUILD_ELEVATION: ${VALHALLA_BUILD_ELEVATION:-true}
    volumes:
      - ./data/valhalla:/custom_files
    ports:
      - "${VALHALLA_ADMIN_PORT:-8003}:3000"
    # Builds take the memory; a state or small country fits, a continent or the planet needs a bigger machine.
    mem_limit: ${VALHALLA_ADMIN_MEM_LIMIT:-3g}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/state"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
